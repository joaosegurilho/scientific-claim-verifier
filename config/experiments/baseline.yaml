experiment:
  name: "baseline"
  description: "Default pipeline, no additional features"

model:
  pipeline_model: "gpt-4o-mini"
  agent_model: "gemini-2.5-flash"
  embedding_model: "nomic-embed-text:v1.5"
  llm_temperature: 0
  chunk_size: 300
  chunk_overlap: 50

kb:
  db_name: baseline_kb

features: []

benchmark:
  - dataset: "scifact"
    split: "test"
    max_claims: null
    method: "agentless"
    max_papers: 10
  
  # - dataset: "msvec"
  #   split: "test"
  #   max_claims: null
  #   method: "agentless"
  #   max_papers: 10

cost_tracking:
  enabled: true
  budget_usd: 5.0
